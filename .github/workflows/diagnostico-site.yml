name: Diagnóstico automático do site

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: diagnostico-site
  cancel-in-progress: true

jobs:
  diagnostico:
    name: Verificar arquivos e site publicado
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Executar diagnóstico
        id: check
        continue-on-error: true
        run: node scripts/diagnostico-site.mjs
        env:
          SITE_URL: https://siteccaj-svg.github.io/Col-gio-stmj/

      - name: Registrar problema no GitHub
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="🤖 Diagnóstico do site encontrou um problema"
          EXISTING=$(gh issue list --repo "$REPO" --state open --search '"Diagnóstico do site encontrou um problema" in:title' --json number --jq '.[0].number // empty')
          BODY=$(printf 'O diagnóstico automático encontrou um problema no repositório ou no site publicado.\n\n- **Execução:** %s\n- **Commit:** %s\n- **Ramo:** %s\n\nAbra a execução acima e consulte a etapa **Executar diagnóstico** para ver os detalhes.\n\nEste aviso não corrige o site automaticamente. Peça ao ChatGPT para analisar o relatório e sugerir a correção antes de alterar arquivos.' "$RUN_URL" "$GITHUB_SHA" "$GITHUB_REF_NAME")
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$REPO" --body "$BODY"
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body "$BODY"
          fi

      - name: Encerrar com falha quando houver problema
        if: steps.check.outcome == 'failure'
        run: exit 1

name: Operação e integridade do site

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 11 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: operacao-integridade-site
  cancel-in-progress: true

jobs:
  verificar:
    name: Conferir código e site publicado
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verificar integridade
        id: check
        continue-on-error: true
        run: node operacao-do-site/verificar-site.mjs
        env:
          SITE_URL: https://siteccaj-svg.github.io/Col-gio-stmj/

      - name: Registrar alerta no GitHub
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Verificação de integridade do site encontrou um problema"
          EXISTING=$(gh issue list --repo "$REPO" --state open --search '"Verificação de integridade do site encontrou um problema" in:title' --json number --jq '.[0].number // empty')
          BODY=$(printf 'A rotina de operação detectou uma falha. Consulte a execução para ver o relatório.\n\n- Execução: %s\n- Commit: %s\n- Ramo: %s\n\nEsta rotina não altera automaticamente o conteúdo do site; revise o diagnóstico antes de corrigir arquivos.' "$RUN_URL" "$GITHUB_SHA" "$GITHUB_REF_NAME")
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$REPO" --body "$BODY"
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body "$BODY"
          fi

      - name: Marcar execução como falha se houver problemas
        if: steps.check.outcome == 'failure'
        run: exit 1
